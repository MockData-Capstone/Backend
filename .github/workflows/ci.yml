name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # 테스트 전용 PostgreSQL (Neon과 같은 엔진). 테스트가 테이블을 비우므로 Neon(운영 DB)에는 붙지 않는다.
    # build.gradle의 TEST_DB_* 기본값(localhost:5432/zipfit_test, postgres/postgres)과 맞춘다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zipfit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & Test
        run: ./gradlew build

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore
