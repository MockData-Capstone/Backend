spring.application.name=zipfit

# 로컬 비밀값(JWT·OAuth 키)은 application-local.properties에 둔다. (application-local.properties.example 참고, 커밋 금지)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zipfit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS (쉼표로 여러 개)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (AUTH-09)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRE:30m}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRE:14d}
jwt.signup-token-expiration=10m

# 카카오 로그인 (AUTH-02)
oauth.kakao.client-id=${KAKAO_REST_API_KEY:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
oauth.kakao.admin-key=${KAKAO_ADMIN_KEY:}

# 구글 로그인 (AUTH-02)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/google/callback}
