spring.application.name=zipfit

# ============================================================================
# 설정은 이 파일 하나에 모은다. 비밀값만 Backend/.env(커밋 금지, .gitignore 대상)에 두고 ${이름}으로 읽는다.
# 저장소가 공개라 비밀값을 이 파일에 직접 쓰면 안 된다. 배포 서버에서는 .env 대신 같은 이름의 환경 변수를 쓴다.
#
# .env에 넣는 값 (KEY=VALUE 한 줄씩)
#   JWT_SECRET            32바이트 이상 랜덤 문자열 (필수). 예: openssl rand -base64 48
#   DB_URL                Neon: jdbc:postgresql://<host>/<db>?sslmode=require&channelBinding=require
#                         Neon 콘솔 > Connect의 postgresql://<user>:<password>@<host>/<db> 에서 host·db를 옮긴다(풀러 주소)
#                         DB 없이 혼자 개발할 때: jdbc:h2:mem:zipfit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
#   DB_USERNAME           Neon 사용자 (H2면 sa)
#   DB_PASSWORD           Neon 비밀번호 (H2면 비움)
#   KAKAO_REST_API_KEY    카카오 디벨로퍼스 > 앱 키 > REST API 키
#   KAKAO_CLIENT_SECRET   카카오 로그인 > 보안 > Client Secret (켰을 때만. 켜져 있는데 비우면 KOE010)
#   KAKAO_ADMIN_KEY       앱 키 > Admin 키 (탈퇴 시 카카오 연결 끊기용, 비워도 됨)
#   GOOGLE_CLIENT_ID      Google Cloud Console > OAuth 2.0 클라이언트 ID (웹 애플리케이션)
#   GOOGLE_CLIENT_SECRET
# 그 밖의 ${이름}은 기본값이 있어 필요할 때만 .env나 환경 변수로 바꾼다.
# ============================================================================
spring.config.import=optional:file:.env[.properties]

# DB. 드라이버는 DB_URL로 정해진다(PostgreSQL 또는 H2).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zipfit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Neon 무료 플랜은 동시 연결 수가 적고, 쉬다가 첫 요청에 DB가 깨어나는 데 시간이 걸린다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS (쉼표로 여러 개)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT (AUTH-09)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRE:30m}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRE:14d}
jwt.signup-token-expiration=10m

# 재발급 토큰 쿠키 (AUTH-09). 프론트·백엔드 도메인이 다르게 배포되면 SameSite=None, Secure=true(HTTPS 필수)로 바꾼다.
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}

# 카카오 로그인 (AUTH-02)
oauth.kakao.client-id=${KAKAO_REST_API_KEY:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}
oauth.kakao.admin-key=${KAKAO_ADMIN_KEY:}

# 구글 로그인 (AUTH-02)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/google/callback}

# 프론트 주소 (비밀번호 재설정 메일 링크에 쓴다)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# 메일 (AUTH-07). spring.mail.host가 없으면 메일 대신 서버 로그에 재설정 링크를 출력한다.
# 실제로 보내려면 아래 주석을 풀고 .env에 MAIL_USERNAME, MAIL_PASSWORD를 넣는다.
# Gmail: 구글 계정 > 보안 > 2단계 인증 > 앱 비밀번호 발급 후 사용
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@zipfit.app}
app.password-reset.expiration=30m
app.invitation.expiration=${INVITATION_EXPIRATION:7d}

# 업로드 파일 (AUTH-05 프로필 이미지). 지금은 로컬 디스크, 배포 시 S3로 교체 예정
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}
storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI 서버 (자체 GPU 서버). 비워 두면 가짜 응답(FakeAiClient)으로 동작한다.
ai.base-url=${AI_BASE_URL:}
ai.read-timeout=${AI_READ_TIMEOUT:30s}
# AI 분석에 넣는 최근 메시지 수 상한 (미결, NFR-004 측정 후 조정)
ai.max-messages=300
ai.analysis-timeout=5m

# 미니게임 (제안값): 가위바위보 라운드 제한 시간, 연결이 끊긴 참가자를 빼기 전 유예 시간
game.round-timeout=10s
game.disconnect-grace=10s

# 실시간 투어: 최대 인원(방문자 포함, NFR-002), 방문자 재참여 대기 시간(미결)
tour.max-participants=6
tour.visitor-rejoin-timeout=3m
# WebRTC: TURN을 비워 두면 STUN만 준다. turn-secret은 coturn의 static-auth-secret과 같아야 한다.
webrtc.stun-urls=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302}
webrtc.turn-urls=${WEBRTC_TURN_URLS:}
webrtc.turn-secret=${WEBRTC_TURN_SECRET:}

# 웹 푸시 VAPID 공개키 (P2). 비워 두면 웹 푸시를 쓰지 않는다.
webpush.vapid-public-key=${WEBPUSH_VAPID_PUBLIC_KEY:}
