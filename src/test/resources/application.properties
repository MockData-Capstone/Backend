spring.datasource.url=jdbc:h2:mem:zipfit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

cors.allowed-origins=http://localhost:5173

jwt.secret=test-secret-key-for-zipfit-must-be-at-least-32-bytes-long
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=14d
jwt.signup-token-expiration=10m

oauth.kakao.client-id=test-kakao-client
oauth.kakao.redirect-uri=http://localhost:5173/oauth/kakao/callback
oauth.google.client-id=test-google-client
oauth.google.client-secret=test-google-secret
oauth.google.redirect-uri=http://localhost:5173/oauth/google/callback

app.frontend-url=http://localhost:5173
app.mail.from=test@zipfit.app
app.password-reset.expiration=30m
storage.local.dir=build/test-uploads
storage.public-base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
